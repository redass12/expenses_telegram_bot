services:
  - type: web
    name: expenses-telegram-bot
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_EXPENSES_DATA_SOURCE_ID
        sync: false
      - key: NOTION_WEEKS_DATA_SOURCE_ID
        sync: false
      - key: ALLOWED_TELEGRAM_USER_ID
        sync: false
      - key: WEEKLY_BUDGET
        value: "20"
      - key: TIMEZONE
        value: Europe/Madrid
      - key: OCR_LANGUAGES
        value: spa+fra+eng
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "90"
      - key: OCR_MAX_ATTEMPTS
        value: "1"
      - key: OCR_PASS_TIMEOUT_SECONDS
        value: "35"
      - key: OCR_TARGET_LONG_SIDE
        value: "1600"
      - key: RAPIDOCR_ENABLED
        value: "true"
      - key: RAPIDOCR_MAX_SIDE_LEN
        value: "1600"
      - key: AUTO_CONFIRM
        value: "false"
      - key: NOTION_API_VERSION
        value: "2026-03-11"
      - key: WEBHOOK_PATH
        value: telegram
